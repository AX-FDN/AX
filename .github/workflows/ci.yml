name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Rust GNU toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal -c rustfmt

      - name: Check Rust formatting
        run: cargo +stable fmt --check

      - name: Run Rust tests
        run: .\scripts\cargo-gnu.ps1 test

      - name: Run diagnostics benchmark smoke
        run: .\scripts\smoke-benchmark-diagnostics.ps1

      - name: Run repair benchmark smoke
        run: .\scripts\smoke-repair-benchmark.ps1

      - name: Run repair comparison smoke
        run: .\scripts\smoke-compare-repair-feedback.ps1

      - name: Run repair mode comparison smoke
        run: .\scripts\smoke-compare-repair-modes.ps1

      - name: Run repair archaeology smoke
        run: .\scripts\smoke-repair-archaeology.ps1 -SkipBuild

  ubuntu-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo +stable fmt --check

      - name: Build axc
        run: cargo build --locked

      - name: Install clang for LLVM AOT smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y clang
          clang --version

      - name: Run Rust unit tests
        run: cargo test --locked --lib

      - name: Run cross-platform interface snapshots
        run: cargo test --locked --test interface_snapshots

      - name: Run LLVM AOT executable smoke
        shell: pwsh
        run: ./scripts/smoke-aot-link.ps1

      - name: Run Linux core CLI smoke
        run: |
          mkdir -p target/ci-fmt
          cat <<'EOF' > target/ci-fmt/format_me.ax
          fn main() -> i32 {
          let value: i32 = 1;
          println(value);
          return 0;
          }
          EOF
          ./target/debug/axc fmt target/ci-fmt/format_me.ax
          grep -F "    let value: i32 = 1;" target/ci-fmt/format_me.ax
          ./target/debug/axc check examples/hello.ax
          ./target/debug/axc run examples/hello.ax
          ./target/debug/axc build examples/project_hello --out-dir target/ci-project-build

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build web workbench
        working-directory: web
        run: npm run build
