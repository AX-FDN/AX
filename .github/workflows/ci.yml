name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install Rust GNU toolchain
        run: rustup toolchain install stable-x86_64-pc-windows-gnu --profile minimal -c rustfmt

      - name: Check Rust formatting
        run: cargo +stable fmt --check

      - name: Run Rust tests
        run: .\scripts\cargo-gnu.ps1 test

      - name: Run diagnostics benchmark smoke
        run: .\scripts\smoke-benchmark-diagnostics.ps1

      - name: Run repair benchmark smoke
        run: .\scripts\smoke-repair-benchmark.ps1

      - name: Run repair comparison smoke
        run: .\scripts\smoke-compare-repair-feedback.ps1

      - name: Run repair mode comparison smoke
        run: .\scripts\smoke-compare-repair-modes.ps1
